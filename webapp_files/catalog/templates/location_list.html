{% extends "base_generic.html" %}

{% block title %}Locations{% endblock %}

{% block content %}
  <h1>Locations</h1>

  {% if location_list %}
    <ul>
      {% for location in location_list %}
        <li><a href="{% url 'location-detail' location.pk %}">{{ location.name }}</a></li>
      {% endfor %}
    </ul>
  {% else %}
    <p>There are no locations yet.</p>
  {% endif %}
{% endblock %}
