<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong</title>
  <!-- Django renders this with no context when the server crashes (DEBUG off),
       so keep it plain HTML with no template tags. -->
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px;
           min-height: 100vh; box-sizing: border-box; display: flex;
           align-items: center; justify-content: center;
           background: #f6f6f4; color: #222; text-align: center; }
    h1 { margin: 0 0 8px; }
    a { color: #0b5cad; }
  </style>
</head>
<body>
  <main>
    <h1>Sorry! Something went wrong.</h1>
    <p>The server ran into a problem. Please try again in a moment.</p>
    <p><a href="/">Go back to the home page</a></p>
  </main>
</body>
</html>
