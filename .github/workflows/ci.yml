name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: psf/black@stable
        with:
          options: "--check --diff"
          src: "."

  django:
    name: Django checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked
        working-directory: webapp_files

      - name: Check Django configuration
        run: uv run python manage.py check
        working-directory: webapp_files
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key

      - name: Run tests
        run: uv run python manage.py test
        working-directory: webapp_files
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key

  docker:
    name: Build deployment image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag biketransit-ci .

  deploy:
    name: Deploy to Google Cloud
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [format, django, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Prepare deployment archive
        run: |
          git archive --format=tar.gz --output="$RUNNER_TEMP/biketransit.tar.gz" HEAD \
            Dockerfile .dockerignore \
            webapp_files/.python-version \
            webapp_files/.env.example \
            webapp_files/manage.py \
            webapp_files/pyproject.toml \
            webapp_files/waypoints.json \
            webapp_files/uv.lock \
            webapp_files/biketransit \
            webapp_files/catalog \
            webapp_files/templates

      - name: Copy app and deploy
        env:
          VM_NAME: cs347-crawf2dj
          VM_ZONE: us-central1-c
        run: |
          gcloud compute scp "$RUNNER_TEMP/biketransit.tar.gz" \
            "$VM_NAME:/tmp/biketransit.tar.gz" --zone "$VM_ZONE"
          gcloud compute ssh "$VM_NAME" --zone "$VM_ZONE" \
            --command="sudo install -d /srv/apps/final_project && sudo tar --overwrite --no-same-owner -xzf /tmp/biketransit.tar.gz -C /srv/apps/final_project && rm /tmp/biketransit.tar.gz && cd /srv/apps && sudo docker compose up -d --build caddy final_project"
